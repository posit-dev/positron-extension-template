name: Positron API Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # @posit-dev/positron-test-electron currently supports macOS only.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
      - run: npm ci
      # Downloads a real Positron build and runs src/test/positron/ inside it.
      - run: npm run test-positron
